[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "biomedical-representation-learning"
version = "0.1.0"
description = "What do learned representations of gene expression capture that interpretable models do not? (SLE, GSE138458)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "truststore",
    "shap",
    "xgboost",
    "torch",
    "umap-learn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "jupyter",
    "nbstripout",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
line-length = 100
